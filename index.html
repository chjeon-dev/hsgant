<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한솔간트차트 (W4, 2026-11-02 기준)</title>
<style>
:root{
  --bg:#ffffff; --surface:#f5f6f4; --text:#1c1f1d; --text2:#4f5551; --muted:#8a908b;
  --line:#dfe2de; --line-strong:#c4c9c4;
  --done:#1baf7a; --han:#6250d6; --delay:#eda100; --now:#b5d4f4; --today:#e34948;
  --warn-bg:#fdf3dc; --warn-text:#8a5a00;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161816; --surface:#202320; --text:#eceeea; --text2:#c2c7c1; --muted:#8a908b;
    --line:#2e322e; --line-strong:#454a45;
    --now:#3d6a96; --warn-bg:#3a2e12; --warn-text:#f1c46a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:20px}
h1{font-size:22px;font-weight:600;margin:0}
.meta{color:var(--muted);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi div{background:var(--surface);border-radius:8px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--text2)}
.kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .warn{background:var(--warn-bg)}
.kpi .warn .l,.kpi .warn .v,.kpi .warn .s{color:var(--warn-text)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;font-size:12px;color:var(--text2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
#all{margin-left:auto;font:inherit;font-size:12px;color:var(--text);background:transparent;border:1px solid var(--line-strong);border-radius:6px;padding:4px 10px;cursor:pointer}
#all:hover{background:var(--surface)}
.scroll{overflow-x:auto}
#g{position:relative;min-width:760px;font-size:12px}
.row{display:grid;grid-template-columns:220px repeat(12,minmax(0,1fr));align-items:center}
.hdr{color:var(--muted)}
.sp{grid-column:span 2;text-align:center;border-bottom:1px solid var(--line);padding-bottom:3px;margin:0 2px}
.wk{text-align:center;line-height:1.3;padding:4px 0 6px}
.wk.cur{color:var(--text);font-weight:600}
.sec{color:var(--text2);font-weight:600;padding:10px 0 4px;border-top:1px solid var(--line)}
.lab{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;padding-right:8px;font-size:13px}
.lab .t{overflow:hidden;text-overflow:ellipsis}
.cnt{color:var(--muted);font-size:11px}
.tg{border:none;background:none;padding:0;width:18px;height:18px;font-size:11px;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.tg.closed{transform:rotate(-90deg)}
.tg:focus-visible,#all:focus-visible{outline:2px solid var(--today);outline-offset:2px}
.bar{margin:0 2px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface);border:1px solid var(--line-strong)}
.kids{display:none}
.kids.open{display:block}
.task .lab{padding-left:26px;font-size:12px;color:var(--text2)}
.task .num{color:var(--muted)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);pointer-events:none}
footer{margin-top:24px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion: reduce){.tg{transition:none}}
@media print{.kids{display:block!important}.tg,#all{display:none}.scroll{overflow:visible}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>한솔간트차트</h1>
  <span class="meta">한솔제지 안전서류 통합관리시스템 구축 · W4 (2026-11-02) 기준 · WBS v2.0</span>
</header>

<section class="kpi">
  <div><div class="l">이노핏 계획 대비</div><div class="v">90%</div><div class="s">9 / 10건 (W1-W3)</div></div>
  <div><div class="l">이노핏 전체</div><div class="v">20%</div><div class="s">9 / 45건</div></div>
  <div><div class="l">한솔제지 업무</div><div class="v">1 / 4건</div><div class="s">W5에 3건 예정</div></div>
  <div class="warn"><div class="l">지연</div><div class="v">1건</div><div class="s">#7 LLM R&amp;D 초기 결과 공유</div></div>
</section>

<div class="legend">
  <span><i class="sw" style="background:var(--done)"></i>이노핏 완료</span>
  <span><i class="sw" style="background:var(--han)"></i>한솔 완료</span>
  <span><i class="sw" style="background:var(--delay)"></i>지연</span>
  <span><i class="sw" style="background:var(--now)"></i>이번 주</span>
  <span><i class="sw" style="background:var(--surface);border:1px solid var(--line-strong)"></i>예정</span>
  <span><i class="sw" style="width:2px;height:12px;background:var(--today)"></i>오늘 (11/2)</span>
  <button id="all" type="button">모두 펼치기</button>
</div>

<div class="scroll"><div id="g"></div></div>

<footer>세부업무명은 화면용 요약이며, 마우스를 올리면 WBS 원문이 표시됩니다. 인쇄 시 세부업무가 모두 펼쳐집니다.</footer>
</div>

<script>
const NOW = 4;
const WEEKS = ['10/12','10/19','10/26','11/2','11/9','11/16','11/23','11/30','12/7','12/14','12/21','12/28'];
const DONE = [1,2,3,4,5,6,8,9,10];
const TASKS = {
1:["미수신 자료 보유 확인","미수신 자료의 현장 보유 여부를 확인하고, 확인이 어려운 자료의 검토 여부를 결정한다."],
2:["키맨 인터뷰","키맨 인터뷰를 셋업하고, 인터뷰를 진행한다."],
3:["계획서-지시서 연결 체크","공사 하나의 계획서-지시서 및 관련 증빙 서류 연결을 체크한다 - 복수 케이스"],
4:["실무 처리 과정 확인","안전관리계획서의 실제 실무 처리 과정을 확인하고, 필요에 따라 일부 녹화한다."],
5:["업무 흐름 구체화","인터뷰 자료를 정리하고, 접수부터 보완까지의 업무 흐름의 구체성을 보강한다."],
6:["챗봇 화면 초안 확인","챗봇(베타)의 화면 초안, 계획서 입력 등 워크플로우의 외관을 확인한다."],
7:["LLM R&D 결과 공유","LLM R&D 초기 결과를 공유한다 - OCR 모델 / LLM 모델 / 토큰 가격 및 운영 예상치 등"],
8:["계획서 파일 업로드","안전관리계획서 파일을 업로드할 수 있다."],
9:["검토 플로우 확인","AI 에이전트의 검토 플로우를 확인할 수 있다."],
10:["주요 정보 원문 대조","문서에서 읽은 주요 정보를 원문과 대조할 수 있다."],
11:["형식 누락 항목 구분","AI 에이전트가 형식 누락 항목과 다른 검토 항목을 구분할 수 있다."],
12:["형식 검토 챗봇 Q&A","형식 검토 프로세스가 챗봇 형태로 구현되고, 해당 검토 결과와 근거에 대해 질의응답할 수 있다."],
13:["리뷰-원문 비교·대조","AI 에이전트의 리뷰 사항과 관련 원문을 비교·대조할 수 있다."],
14:["다문서 맥락 형식 판단","AI 에이전트가 하나의 공사에 관련된 여러 문서를 연결된 맥락으로 인식하여 형식상 판단을 진행한다."],
15:["법률·내규 재검토 판별","법률 및 내규 상 재검토 항목 및 추가 확인 필요 항목을 판별할 수 있다."],
16:["법률·내규 챗봇 Q&A","법률 및 내규 검토 프로세스가 챗봇 형태로 구현되고, 해당 검토 결과와 근거에 대해 질의응답할 수 있다."],
17:["지적-법률 근거 매칭","AI 에이전트의 지적 사항과 법률 근거 및 내규 출처를 매칭하여 확인할 수 있다."],
18:["다문서 맥락 법률 판단","AI 에이전트가 하나의 공사에 관련된 여러 문서를 연결된 맥락으로 인식하여 법률 및 내규상 판단을 진행한다."],
19:["통합 재검토 항목 판별","형식 - 법률 및 내규 - 내용 상 재검토 항목 및 추가 확인 필요 항목을 판별할 수 있다."],
20:["통합 검토 챗봇 Q&A","통합 검토 프로세스가 챗봇 형태로 구현되고, 해당 검토 결과와 근거에 대해 질의응답할 수 있다."],
21:["지적 사항 근거 확인","AI 에이전트의 지적 사항과 관련 근거를 확인할 수 있다."],
22:["통합 다문서 맥락 인식","형식, 법률 및 내규, 내용 및 맥락 검토 시, AI 에이전트가 하나의 공사에 관련된 여러 문서를 연결된 맥락으로 인식할 수 있다."],
23:["RAG 초기 구조 확인","AI 에이전트 작동에 필요한 RAG 초기 구조와 작동을 확인할 수 있다."],
24:["검토 의견 채택·수정","AI 에이전트의 검토 의견을 채택하거나 수정 의견을 남길 수 있다."],
25:["검토 의견 문서화","검토 의견 및 보완 요청을 하나의 문서로 받아볼 수 있다."],
26:["수정 의견 해석 프로세스","챗봇 상 접수된 수정 의견을 모아 확인하고, 해석하는 프로세스를 제안한다."],
27:["현업 실제 계획서 검토","현업 담당자가 실제 안전관리계획서를 업로드하고, 챗봇에서 검토 결과를 확인할 수 있다."],
28:["지적 근거 질의","지적 항목의 근거를 질문하고, 원문 및 관련 지식을 확인할 수 있다."],
29:["오지적·누락 정리","현업 검토 의견을 바탕으로 AI 에이전트가 잘못 지적한 항목과 놓친 항목을 정리한다."],
30:["불편·추가 요청 협의","사용 중 불편한 점과 추가 요청을 모아, 다음 반영 항목을 협의한다."],
31:["피드백 반영 재검토","피드백이 반영된 챗봇으로 같은 사례를 다시 검토하고, 성능 개선에 시간이 필요한 내용은 별도로 정의한다."],
32:["보완 자료 재업로드 확인","보완한 자료를 다시 업로드해 이전 지적사항이 해소되었는지 확인할 수 있다."],
33:["다양한 사례 정합성","점점 더 많은 사례를 적용해보고, 다양한 케이스에 대한 AI 에이전트 판단 결과 정합성을 체크할 수 있다."],
34:["사용성 개선 반영","챗봇 사용성 개선 의견을 검토하고, 협의한 항목을 반영한다."],
35:["최종 기능 정의","현업 사용 결과를 바탕으로 추가 보강하거나 삭제할 기능을 정의하고, 최종 산출 버전과 후속 검토 항목을 정의할 수 있다."],
36:["최종 반영본 전체 흐름","최종 항목이 반영된 챗봇에서 자료 업로드·검토·질의응답·보완 요청을 진행할 수 있다."],
37:["대표 사례 최종 확인","선정한 대표 사례의 AI 검토 결과를 최종 확인 담당자와 검토하고, 확인 의견을 정리한다."],
38:["적용 전 확인 사항","AI 에이전트 최종 적용 전 추가 확인이 필요한 사항과 처리 계획을 함께 확인할 수 있다."],
39:["운영 환경 접속 검토","합의한 운영 환경에서 지정된 계정으로 챗봇에 접속해 문서를 검토할 수 있다."],
40:["사용자 교육·설명서","사용자 대상의 교육 혹은 사용 설명서 배포를 진행한다."],
41:["처리 실패 대응·문의 경로","문서 처리에 실패했을 때 확인할 사항과 문의 경로를 준비한다."],
42:["기준·자료 갱신 절차","운영 담당자는 검토 기준·참고 자료의 관리 및 갱신 절차를 확인한다."],
43:["성능·운영비 공유","합의한 대표 사례의 성능 확인 결과와 운영비 추정치를 공유한다."],
44:["사용·검토 이력 확인","합의한 사용·검토 이력의 기록 여부를 확인한다."],
45:["이관·잔여 사항 확인","이관 자료와 잔여 사항의 다음 조치·담당·일정을 함께 확인한다."]
};
const WEEK_RANGE = [[1,1,4],[2,5,7],[3,8,10],[4,11,14],[5,15,18],[6,19,23],[7,24,26],[8,27,30],[9,31,34],[10,35,38],[11,39,42],[12,43,45]];
const MILESTONES = [
  ["M1 준비·검토 방향",1,2,1,7],["M2 AI 에이전트 코어",3,5,8,18],["M3 통합 검토 시연",6,6,19,23],
  ["M4 중간보고",7,7,24,26],["M5 현업 사용·피드백",8,10,27,38],["M6 운영 준비",11,11,39,42],["M7 이관 공유",12,12,43,45]
];
const HANSOL = [
  ["안전관리계획서 검토 know-how 이전",1,1,1],["작업허가서 검토 TO-BE 모델 수립",5,5,0],
  ["승인 체계 TO-BE 모델 수립",5,5,0],["작업허가서 검토 know-how 이전",5,5,0]
];

const weekOf = n => WEEK_RANGE.find(r => n >= r[1] && n <= r[2])[0];
const status = n => DONE.includes(n) ? 'done' : (weekOf(n) < NOW ? 'delay' : (weekOf(n) === NOW ? 'now' : 'plan'));
const COLOR = {done:'var(--done)', delay:'var(--delay)', now:'var(--now)', plan:'var(--surface)'};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const bar = (s,e,inner,h,border) => `<div class="bar" style="grid-column:${s+1}/${e+2};height:${h}px;${border?`border-color:${border}`:''}">${inner}</div>`;

let h = '<div class="row hdr"><span></span>';
for (let s = 1; s <= 6; s++) h += `<span class="sp">S${s}</span>`;
h += '</div><div class="row hdr"><span></span>';
WEEKS.forEach((d,i) => h += `<span class="wk${i === NOW-1 ? ' cur' : ''}">W${i+1}<br>${d}</span>`);
h += '</div><div class="sec">이노핏 수행 (45건)</div>';

MILESTONES.forEach(([label,s,e,a,b], i) => {
  const ids = []; for (let n = a; n <= b; n++) ids.push(n);
  const t = ids.length, c = ids.filter(n => status(n) === 'done').length, d = ids.filter(n => status(n) === 'delay').length;
  h += `<div class="row" style="height:32px"><span class="lab"><button class="tg closed" type="button" data-i="${i}" aria-expanded="false" aria-label="${label} 세부업무 펼치기">▼</button><span class="t">${label}</span><span class="cnt">${c}/${t}</span></span>`
     + bar(s,e,`<div style="width:${c/t*100}%;background:var(--done)"></div><div style="width:${d/t*100}%;background:var(--delay)"></div>`,16) + '</div>';
  h += `<div class="kids" id="k${i}">`;
  ids.forEach(n => {
    const w = weekOf(n), st = status(n);
    h += `<div class="row task" style="height:24px" title="${n}. ${esc(TASKS[n][1])}"><span class="lab"><span class="t"><span class="num">${n}.</span> ${esc(TASKS[n][0])}</span></span>`
       + bar(w,w,`<div style="width:100%;background:${COLOR[st]}"></div>`,10, st === 'plan' ? '' : 'transparent') + '</div>';
  });
  h += '</div>';
});

h += '<div class="sec">한솔제지 협업 (4건)</div>';
HANSOL.forEach(([label,s,e,c]) => {
  h += `<div class="row" style="height:32px"><span class="lab" style="padding-left:22px"><span class="t">${label}</span></span>`
     + bar(s,e, c ? '<div style="width:100%;background:var(--han)"></div>' : '',16) + '</div>';
});
h += `<div class="today" style="left:calc(220px + (100% - 220px) * ${NOW-1} / 12)"></div>`;

const g = document.getElementById('g');
g.innerHTML = h;

const setOpen = (i, open) => {
  document.getElementById('k'+i).classList.toggle('open', open);
  const b = g.querySelector(`.tg[data-i="${i}"]`);
  b.classList.toggle('closed', !open);
  b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', MILESTONES[i][0] + (open ? ' 세부업무 접기' : ' 세부업무 펼치기'));
};
g.querySelectorAll('.tg').forEach(b => b.addEventListener('click', () => {
  const i = b.dataset.i;
  setOpen(i, !document.getElementById('k'+i).classList.contains('open'));
}));
const all = document.getElementById('all');
let allOpen = false;
all.addEventListener('click', () => {
  allOpen = !allOpen;
  MILESTONES.forEach((_, i) => setOpen(i, allOpen));
  all.textContent = allOpen ? '모두 접기' : '모두 펼치기';
});
</script>
</body>
</html>
